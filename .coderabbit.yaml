# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit settings: reviews only the card, with few and relevant comments.
# Free for public repositories. Docs: https://docs.coderabbit.ai/reference/configuration
language: en-US

reviews:
  # quiet = only important findings, chill = balanced, assertive = many (nitpicky)
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false
    # documentation-only PRs need no automatic review
    ignore_title_keywords:
      - "docs:"
      - "docs("

  # Only the code: no Markdown or images
  path_filters:
    - "!**/*.md"
    - "!**/*.png"

  path_instructions:
    - path: "max-week-profile-card.js"
      instructions: >-
        Home Assistant dashboard card (custom element, one plain JavaScript file, no build step, no dependencies)
        that edits the week programme of eQ-3 MAX! thermostats from max2mqtt and sends changed days through a script
        or text entities. Check: limits of the MAX! programme (at most max_points switch points per day, default 13;
        times in step_minutes, default 5; temperatures in temp_step, default 0.5 °C), that only changed days are sent,
        mouse and touch (pointer) handling including phones, event listeners that leak or pile up on re-render, work
        done on every hass update, errors of service calls shown to the user, and that every user-visible text exists
        in I18N for both en and de. No entity IDs of the maintainer's setup as new defaults.
    - path: "hacs.json"
      instructions: "filename must match the card file; keep homeassistant (minimum version) consistent with the README."

  pre_merge_checks:
    docstrings:
      mode: "off"

chat:
  auto_reply: true
