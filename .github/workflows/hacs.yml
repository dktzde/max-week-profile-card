name: HACS validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 7 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: plugin
